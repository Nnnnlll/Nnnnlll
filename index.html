<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dfe7f8">
<title>大大小小</title>
<script>
/* 首屏前就定档：手机默认关折射（否则会先卡几秒） */
(function () {
  var ua = navigator.userAgent;
  var mob = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua)
         || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 820);
  var d = document.documentElement;
  d.setAttribute('data-mob', mob ? '1' : '0');
  if (mob) d.classList.add('no-refract');
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --glass-bg: rgba(255,255,255,.16);
    --glass-bg-strong: rgba(255,255,255,.26);
    --glass-line: rgba(255,255,255,.55);
    --ink: #1d2433;
    --ink-soft: #6b7688;
    --shadow: 0 10px 30px rgba(31,50,90,.16);
    --accent: #4a90e2;
  }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background: #e8eef9;
    padding: 22px 18px 40px;
    overflow-x: hidden;
    position: relative;
    transition: background .5s, color .5s;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 背景：流动色斑（折射需要底下有东西） ── */
  .bg { position: fixed; inset: -20%; z-index: 0; pointer-events: none; }
  .blob {
    position: absolute; width: 58vw; height: 58vw; max-width: 460px; max-height: 460px;
    border-radius: 50%; filter: blur(44px); opacity: .78;
    will-change: transform;
  }
  .b1 { background: #7fb6ff; top: -6%;  left: -12%; animation: drift1 34s ease-in-out infinite alternate; }
  .b2 { background: #ff9ec4; top: 26%;  right: -18%; animation: drift2 40s ease-in-out infinite alternate; }
  .b3 { background: #a6f0d8; bottom: -12%; left: 4%; animation: drift3 38s ease-in-out infinite alternate; }
  .b4 { background: #ffd98a; bottom: 22%; right: 6%; animation: drift4 44s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate3d(14vw, 10vh, 0) scale(1.15); } }
  @keyframes drift2 { to { transform: translate3d(-16vw, 12vh, 0) scale(1.1); } }
  @keyframes drift3 { to { transform: translate3d(12vw, -14vh, 0) scale(1.2); } }
  @keyframes drift4 { to { transform: translate3d(-10vw, -10vh, 0) scale(1.05); } }

  /* ── 漂浮物层 ── */
  #floatLayer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .float { position: absolute; }
  .bubble {
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(210,235,255,.55) 30%, rgba(150,200,255,.25) 65%, rgba(120,170,255,.08) 100%);
    box-shadow: inset -3px -4px 8px rgba(255,255,255,.7), inset 3px 4px 10px rgba(90,140,220,.25), 0 0 8px rgba(180,215,255,.4);
    animation: floatUp linear infinite;
  }
  .leaf {
    background: radial-gradient(circle at 30% 30%, #ffcf7a, #e08a2e 60%, #a85a12);
    border-radius: 0 70% 0 70%;
    box-shadow: 0 0 4px rgba(180,120,40,.5);
    animation: fallSpin linear infinite;
  }
  .rain {
    width: 2px; background: linear-gradient(to bottom, rgba(180,215,255,.1), rgba(120,180,255,.85));
    border-radius: 2px; box-shadow: 0 0 4px rgba(140,190,255,.6);
    animation: rainFall linear infinite;
  }
  .snow {
    background: radial-gradient(circle, #fff 0%, #e8f4ff 60%, rgba(230,245,255,.2) 100%);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,255,255,.9), 0 0 12px rgba(200,230,255,.6);
    animation: fallSpin linear infinite;
  }
  .star {
    background: radial-gradient(circle, #fff7c2 0%, #ffd84a 55%, rgba(255,200,60,.1) 100%);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    box-shadow: 0 0 8px rgba(255,220,90,.9);
    animation: fallSpin linear infinite;
  }
  .heart {
    background: radial-gradient(circle at 35% 35%, #ff9bb0, #ff4d6d 60%, #c81e3f);
    clip-path: path('M7 13 C-2 6 0 0 4 0 C6 0 7 2 7 2 C7 2 8 0 10 0 C14 0 16 6 7 13 Z');
    box-shadow: 0 0 6px rgba(255,90,120,.7);
    animation: fallSpin linear infinite;
  }
  @keyframes floatUp { 0% { transform: translateY(0) scale(1) rotate(0); opacity: .7; } 100% { transform: translateY(-115vh) scale(1.15) rotate(20deg); opacity: 0; } }
  @keyframes fallSpin { 0% { transform: translateY(-12vh) rotate(0); opacity: .95; } 100% { transform: translateY(112vh) rotate(360deg); opacity: 0; } }
  @keyframes rainFall { 0% { transform: translateY(-12vh); opacity: .85; } 100% { transform: translateY(112vh); opacity: 0; } }

  /* ── 液态玻璃基类（hyalite 注入真实折射） ── */
  .glass {
    position: relative;
    border-radius: 26px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-line);
    backdrop-filter: var(--hyalite, blur(14px) saturate(180%));
    -webkit-backdrop-filter: var(--hyalite, blur(14px) saturate(180%));
    box-shadow: var(--hyalite-edge, none), var(--shadow);
    transition: background .4s, border-color .4s, box-shadow .4s, transform .18s;
  }
  /* 顶部高光，让玻璃看起来有厚度 */
  .glass::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 26%, rgba(255,255,255,0) 52%);
    mix-blend-mode: screen; opacity: .7;
  }

  /* ── 卡片：永远用普通模糊，不做折射（6 个变 2 个，这是最大的一刀） ── */
  .glass.lite {
    backdrop-filter: blur(12px) saturate(160%);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), var(--shadow);
  }

  /* ── 流畅档：一键退回纯 CSS 玻璃 ── */
  html.no-refract .glass {
    --hyalite: none !important;
    --hyalite-edge: none !important;
    backdrop-filter: blur(14px) saturate(165%) !important;
    -webkit-backdrop-filter: blur(14px) saturate(165%) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), var(--shadow);
  }
  html.no-refract .glass::after { mix-blend-mode: normal; opacity: .5; }
  html.no-bg .blob { animation: none !important; will-change: auto; }
  html.no-bg .blob { filter: blur(40px); }
  html.paused .blob, html.paused .float { animation-play-state: paused !important; }

  .wrap { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; }

  .hero { padding: 20px 22px; margin-bottom: 26px; }
  .hero h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .hero .sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }

  .section-title { font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 0 0 12px 6px; letter-spacing: 1px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

  .card {
    display: block; text-decoration: none; color: inherit;
    padding: 18px 16px; cursor: pointer; border-radius: 24px;
  }
  .card:hover { transform: translateY(-3px); }
  .card:active { transform: translateY(1px) scale(.985); }
  .card .icon { font-size: 28px; margin-bottom: 10px; }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .desc { font-size: 12px; color: var(--ink-soft); line-height: 1.45; margin-top: 3px; }

  /* 玻璃按钮（不做折射，省性能） */
  .glass-btn {
    border: 1px solid var(--glass-line);
    background: var(--glass-bg-strong);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    box-shadow: 0 6px 18px rgba(31,50,90,.16);
    color: inherit;
  }
  #settingBtn {
    position: fixed; top: 16px; right: 16px; width: 44px; height: 44px;
    border-radius: 50%; font-size: 19px; cursor: pointer; z-index: 30;
    display: flex; align-items: center; justify-content: center;
  }
  #settingBtn:active { transform: scale(.94); }

  #settingPanel {
    position: fixed; top: 14px; right: -330px; width: 300px; max-width: 86vw;
    max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 22px; border-radius: 28px; z-index: 40;
    transition: right .35s cubic-bezier(.4,0,.2,1), background .4s, border-color .4s;
  }
  #settingPanel.open { right: 14px; }
  #settingPanel h2 { font-size: 17px; margin-bottom: 14px; }
  #closeSetting {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border: none;
    border-radius: 50%; font-size: 15px; cursor: pointer; color: var(--ink-soft);
    background: rgba(255,255,255,.35);
  }
  .setting-label { font-size: 12px; color: var(--ink-soft); margin: 16px 0 8px; letter-spacing: .5px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    padding: 7px 13px; border-radius: 14px; font-size: 13px; cursor: pointer;
    color: var(--ink); border: 1px solid rgba(255,255,255,.5);
    background: rgba(255,255,255,.3); backdrop-filter: blur(8px);
    transition: all .16s;
  }
  .opt.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(74,144,226,.4); }
  .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 4px; font-size: 14px; }
  .switch { position: relative; width: 46px; height: 26px; background: rgba(120,130,150,.4); border-radius: 13px; cursor: pointer; transition: background .25s; }
  .switch.on { background: var(--accent); }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left .25s; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
  .switch.on::after { left: 23px; }
  .hint { font-size: 11px; color: var(--ink-soft); opacity: .8; margin-top: 10px; line-height: 1.5; }
  #fpsText { font-size: 11px; color: var(--ink-soft); opacity: .7; margin-top: 16px; text-align: center; }

  .player { margin-top: 26px; padding: 20px; border-radius: 26px; }
  .player .title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .song-list { display: flex; flex-direction: column; gap: 9px; }
  .song-btn {
    text-align: left; padding: 11px 14px; border-radius: 16px; font-size: 13px; cursor: pointer;
    color: var(--ink); font-family: inherit;
    border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.28);
    backdrop-filter: blur(8px); transition: all .16s;
  }
  .song-btn:hover { background: rgba(255,255,255,.45); }
  .song-btn.playing { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(74,144,226,.35); }
  .now-playing { margin-top: 14px; font-size: 13px; color: var(--ink-soft); min-height: 18px; }
  audio { width: 100%; margin-top: 10px; border-radius: 14px; }

  footer { margin-top: 34px; text-align: center; font-size: 12px; color: var(--ink-soft); opacity: .8; }

  /* ── 暗色 ── */
  body.dark {
    --glass-bg: rgba(255,255,255,.07);
    --glass-bg-strong: rgba(255,255,255,.1);
    --glass-line: rgba(255,255,255,.14);
    --ink: #e8ecf4;
    --ink-soft: #909ab0;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    background: #10141c;
  }
  body.dark .blob { opacity: .5; }
  body.dark .glass::after { opacity: .28; }
  body.dark .opt { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); }
  body.dark .opt.active { background: var(--accent); border-color: var(--accent); }
  body.dark .song-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.13); }
  body.dark .song-btn.playing { background: var(--accent); border-color: var(--accent); }
  body.dark #closeSetting { background: rgba(255,255,255,.1); }
/* 游戏弹窗 */
.gamemodal{position:fixed;inset:0;z-index:99;display:none}
.gamemodal.on{display:block}
.gamemodal-mask{position:absolute;inset:0;background:rgba(6,10,22,.55)}
.gamemodal-box{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;width:min(96vw,560px);height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden;border-radius:18px}
.gamemodal-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-weight:700;font-size:14px}
.gamemodal-acts{display:flex;align-items:center;gap:10px}
.gamemodal-acts a{font-size:12px;opacity:.8;text-decoration:none;color:inherit}
.gamemodal-acts button{border:0;background:transparent;font-size:17px;line-height:1;color:inherit;cursor:pointer;padding:2px 4px}
#gameFrame{flex:1;width:100%;border:0;background:#0d1220}
</style>
</head>
<body>

<div class="bg">
  <span class="blob b1"></span><span class="blob b2"></span>
  <span class="blob b3"></span><span class="blob b4"></span>
</div>
<div id="floatLayer"></div>

<button id="settingBtn" class="glass-btn">⚙️</button>

<div id="settingPanel" class="glass">
  <button id="closeSetting">✕</button>
  <h2>设置</h2>

  <div class="setting-label">漂浮物</div>
  <div class="opts" id="typeOpts">
    <div class="opt active" data-type="bubble">泡泡</div>
    <div class="opt" data-type="leaf">秋叶</div>
    <div class="opt" data-type="rain">雨滴</div>
    <div class="opt" data-type="snow">雪花</div>
    <div class="opt" data-type="star">星星</div>
    <div class="opt" data-type="heart">爱心</div>
    <div class="opt" data-type="none">关闭</div>
  </div>

  <div class="setting-label">数量</div>
  <div class="opts" id="countOpts">
    <div class="opt" data-count="8">少</div>
    <div class="opt active" data-count="14">中</div>
    <div class="opt" data-count="24">多</div>
  </div>

  <div class="setting-row">
    <span>暗色模式</span>
    <div class="switch" id="darkSwitch"></div>
  </div>

  <div class="setting-label">液态玻璃折射</div>
  <div class="opts" id="glassOpts">
    <div class="opt active" data-refract="auto">自动</div>
    <div class="opt" data-refract="on">开</div>
    <div class="opt" data-refract="off">关</div>
  </div>

  <div class="setting-row">
    <span>背景流动</span>
    <div class="switch on" id="bgSwitch"></div>
  </div>

  <div class="hint">自动＝手机默认关闭折射、桌面默认开启；一旦检测到掉帧会自动降为流畅模式。</div>
  <div id="fpsText">— FPS</div>
</div>

<div class="wrap" id="app">

  <header class="hero glass">
    <h1>大大小小</h1>
    <div class="sub">收录好用的小工具</div>
  </header>

  <div class="section-title">滴滴滴</div>
  <div class="grid">

    <a class="card glass lite" href="https://www.douyin.com" target="_blank" rel="noopener">
      <div class="icon">🎵</div>
      <div class="name">抖音</div>
    </a>

    <a class="card glass lite" href="https://www.kuaishou.com" target="_blank" rel="noopener">
      <div class="icon">🎬</div>
      <div class="name">快手</div>
    </a>

    <a class="card glass lite" href="#" onclick="openGame(); return false;">
      <div class="icon">🎮</div>
      <div class="name">Game</div>
    </a>

    <a class="card glass lite" href="#" onclick="alert('等待更新'); return false;">
      <div class="icon">⏳</div>
      <div class="name">未完待续</div>
      <div class="desc">更多内容，敬请期待</div>
    </a>

  </div>

  <section class="player glass">
    <div class="title">🎧 音乐播放器</div>
    <div class="song-list" id="songList"></div>
    <div class="now-playing" id="nowPlaying">选择一首歌开始播放</div>
    <audio id="audio" controls preload="none"></audio>
  </section>

  <footer>作者：林紫涵，+10086</footer>
</div>

<!-- 游戏弹窗 -->
<div class="gamemodal" id="gameModal" aria-hidden="true">
  <div class="gamemodal-mask" onclick="closeGame()"></div>
  <div class="gamemodal-box glass">
    <div class="gamemodal-bar">
      <span>🐸 奶蛙 2048</span>
      <div class="gamemodal-acts">
        <a href="https://yhsome.github.io/Nai2048/" target="_blank" rel="noopener">新窗口打开</a>
        <button type="button" onclick="closeGame()" aria-label="关闭">✕</button>
      </div>
    </div>
    <iframe id="gameFrame" title="奶蛙 2048" data-src="https://yhsome.github.io/Nai2048/" allowfullscreen></iframe>
  </div>
</div>

<script src="hyalite.js"></script>
<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var isMobile = root.getAttribute('data-mob') === '1';

  /* ── 性能档 ── */
  var state = { refract: 'auto', bgMotion: true };
  var lowFps = false;

  function wantRefract() {
    if (state.refract === 'on') return true;
    if (state.refract === 'off') return false;
    return !isMobile && !lowFps;      // 自动：手机默认关
  }
  function wantBg() { return state.bgMotion && !lowFps; }

  function applyPerf() {
    root.classList.toggle('no-refract', !wantRefract());
    root.classList.toggle('no-bg', !wantBg());
  }
  applyPerf();

  /* 切到后台就停掉所有动画，省电省 CPU */
  document.addEventListener('visibilitychange', function () {
    root.classList.toggle('paused', document.hidden);
  });

  /* 前 4 秒测帧率，不够 50 就自动降级（只降一次，不反复横跳） */
  var frames = 0, t0 = 0, samples = 8, sum = 0, done = false, fps = 0;
  var fpsText = document.getElementById('fpsText');
  function loop(ts) {
    frames++;
    if (!t0) t0 = ts;
    if (ts - t0 >= 500) {
      fps = Math.round(frames * 1000 / (ts - t0));
      frames = 0; t0 = ts;
      if (fpsText && document.getElementById('settingPanel').classList.contains('open')) {
        fpsText.textContent = '当前约 ' + fps + ' FPS';
      }
      if (!done && !document.hidden) {
        sum += fps; samples--;
        if (samples === 0) {
          if (sum / 8 < 50) { lowFps = true; applyPerf(); }
          done = true;
        }
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ── 漂浮物 ── */
  var floatLayer = document.getElementById('floatLayer');
  var currentType = 'bubble';
  var currentCount = 14;
  function rand(a, b) { return Math.random() * (b - a) + a; }

  function renderFloat() {
    floatLayer.innerHTML = '';
    if (currentType === 'none') return;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < currentCount; i++) {
      var el = document.createElement('div');
      el.className = 'float ' + currentType;
      var size;
      if (currentType === 'bubble') size = rand(12, 46);
      else if (currentType === 'rain') size = rand(1.2, 2.4);
      else if (currentType === 'star') size = rand(7, 16);
      else if (currentType === 'heart') size = rand(9, 20);
      else if (currentType === 'snow') size = rand(6, 15);
      else size = rand(9, 20);

      el.style.left = rand(0, 100) + 'vw';
      if (currentType === 'bubble') {
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.bottom = '-60px';
        el.style.animationDuration = rand(8, 18) + 's';
        el.style.animationDelay = rand(0, 8) + 's';
      } else {
        el.style.width = size + 'px';
        el.style.height = (currentType === 'rain' ? rand(14, 22) : size) + 'px';
        el.style.top = '-40px';
        el.style.animationDuration = rand(6, 15) + 's';
        el.style.animationDelay = rand(0, 8) + 's';
      }
      frag.appendChild(el);
    }
    floatLayer.appendChild(frag);
  }
  renderFloat();

  /* ── 液态玻璃（hyalite）── 只给大块上折射，卡片已经用 .lite 排除掉 ── */
  try {
    if (typeof Hyalite !== 'undefined') {
      Hyalite.watch(document.getElementById('app'), '.glass:not(.lite)', {
        bevel: 24, thickness: 36, slope: 2.2,
        dispersion: 0.8, shade: 0.34, rim: 1.1,
        blur: 1, sat: 1, edge: 0.3, materialize: 180
      });
      Hyalite.attach(document.getElementById('settingPanel'), {
        bevel: 22, thickness: 32, dispersion: 0.8, shade: 0.34, rim: 1.1, sat: 1, materialize: 180
      });
    }
  } catch (e) { /* 不支持时自动退回普通模糊 */ }

  /* ── 设置面板 ── */
  var settingBtn = document.getElementById('settingBtn');
  var settingPanel = document.getElementById('settingPanel');
  var closeSetting = document.getElementById('closeSetting');
  var darkSwitch = document.getElementById('darkSwitch');
  var bgSwitch = document.getElementById('bgSwitch');

  settingBtn.onclick = function () { settingPanel.classList.add('open'); };
  closeSetting.onclick = function () { settingPanel.classList.remove('open'); };

  var typeOpts = document.querySelectorAll('#typeOpts .opt');
  Array.prototype.forEach.call(typeOpts, function (opt) {
    opt.onclick = function () {
      Array.prototype.forEach.call(typeOpts, function (o) { o.classList.remove('active'); });
      opt.classList.add('active');
      currentType = opt.getAttribute('data-type');
      renderFloat();
    };
  });

  var countOpts = document.querySelectorAll('#countOpts .opt');
  Array.prototype.forEach.call(countOpts, function (opt) {
    opt.onclick = function () {
      Array.prototype.forEach.call(countOpts, function (o) { o.classList.remove('active'); });
      opt.classList.add('active');
      currentCount = parseInt(opt.getAttribute('data-count'), 10);
      renderFloat();
    };
  });

  var glassOpts = document.querySelectorAll('#glassOpts .opt');
  Array.prototype.forEach.call(glassOpts, function (opt) {
    opt.onclick = function () {
      Array.prototype.forEach.call(glassOpts, function (o) { o.classList.remove('active'); });
      opt.classList.add('active');
      state.refract = opt.getAttribute('data-refract');
      applyPerf();
    };
  });

  darkSwitch.onclick = function () {
    darkSwitch.classList.toggle('on');
    document.body.classList.toggle('dark');
  };

  bgSwitch.onclick = function () {
    bgSwitch.classList.toggle('on');
    state.bgMotion = bgSwitch.classList.contains('on');
    applyPerf();
  };

  /* ── 音乐播放器 ── */
  var songs = [
    { name: '示例音乐 1', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
    { name: '示例音乐 2', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
    { name: '示例音乐 3', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }
  ];
  var audio = document.getElementById('audio');
  var songList = document.getElementById('songList');
  var nowPlaying = document.getElementById('nowPlaying');

  songs.forEach(function (song, i) {
    var btn = document.createElement('button');
    btn.className = 'song-btn';
    btn.textContent = '▶ ' + song.name;
    btn.onclick = function () { playSong(i); };
    songList.appendChild(btn);
  });

  function playSong(index) {
    var song = songs[index];
    audio.src = song.src;
    audio.play();
    nowPlaying.textContent = '正在播放：' + song.name;
    var btns = document.querySelectorAll('.song-btn');
    Array.prototype.forEach.call(btns, function (b, i) {
      b.classList.toggle('playing', i === index);
      b.textContent = (i === index ? '🎵 ' : '▶ ') + songs[i].name;
    });
  }
})();
</script>

<script>
function openGame() {
  var m = document.getElementById('gameModal');
  var f = document.getElementById('gameFrame');
  if (f && !f.getAttribute('src')) f.setAttribute('src', f.getAttribute('data-src'));
  m.classList.add('on');
  m.setAttribute('aria-hidden', 'false');
  document.documentElement.style.overflow = 'hidden';
  return false;
}
function closeGame() {
  var m = document.getElementById('gameModal');
  m.classList.remove('on');
  m.setAttribute('aria-hidden', 'true');
  document.documentElement.style.overflow = '';
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeGame();
});
</script>

</body>
</html>
