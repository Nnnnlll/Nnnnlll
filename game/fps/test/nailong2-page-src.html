<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>奶龙 v2.0 · 三视图重建预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#12141a; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    color:#e8e8ea; -webkit-tap-highlight-color:transparent;
  }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  .hud {
    position:fixed; left:12px; top:12px; z-index:10;
    background:rgba(20,22,30,.78); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.10); border-radius:12px;
    padding:10px 12px; font-size:12px; line-height:1.65;
    font-variant-numeric:tabular-nums; pointer-events:none; min-width:186px;
  }
  .hud b { color:#ffd75e; font-weight:600; }
  .hud .k { color:#8b93a5; }
  .bar {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; gap:6px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(12,14,20,.92), rgba(12,14,20,0));
  }
  .bar button {
    flex:1; min-width:0; padding:11px 4px; border-radius:10px; cursor:pointer;
    border:1px solid rgba(255,255,255,.13); background:rgba(40,44,56,.85);
    color:#e8e8ea; font-size:13px; font-family:inherit;
    transition:background .16s, border-color .16s;
  }
  .bar button:active { background:rgba(70,76,94,.95); }
  .bar button.on { background:#ffd75e; color:#1a1a1a; border-color:#ffd75e; font-weight:600; }
  .tip {
    position:fixed; right:12px; top:12px; z-index:10; max-width:158px;
    background:rgba(20,22,30,.72); border:1px solid rgba(255,255,255,.09);
    border-radius:10px; padding:8px 10px; font-size:11px; color:#9aa1b1; line-height:1.6;
    pointer-events:none;
  }
  #loading {
    position:fixed; inset:0; z-index:50; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:14px;
    background:#12141a; font-size:14px; color:#9aa1b1;
  }
  #loading .spin {
    width:30px; height:30px; border-radius:50%;
    border:2.5px solid rgba(255,215,94,.22); border-top-color:#ffd75e;
    animation:sp .8s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }
  #err { max-width:80%; color:#ff8a7a; line-height:1.7; text-align:center; font-size:13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div><b>奶龙 v2.0</b> · 三视图重建</div>
  <div><span class="k">三角面</span> <span id="hTri">—</span></div>
  <div><span class="k">总高</span> <span id="hH">—</span> m</div>
  <div><span class="k">最宽</span> <span id="hW">—</span> m</div>
  <div><span class="k">帧率</span> <span id="hFps">—</span></div>
</div>

<div class="tip">
  单指拖动 = 旋转<br>
  双指 = 缩放 / 平移<br>
  点下方按钮切换动画
</div>

<div class="bar">
  <button data-st="idle" class="on">待机</button>
  <button data-st="walk">走动</button>
  <button data-st="jump">跳跃</button>
  <button data-st="spin">转一圈</button>
</div>

<div id="loading">
  <div class="spin"></div>
  <div id="msg">正在生成奶龙（距离场 → 等值面）…</div>
  <div id="err"></div>
</div>

<script>__THREE__</script>
<script>__BLOB__</script>
<script>__BAKED__</script>
<script>
/* 把烘焙的 base64 几何还原成数组，供模型直接读取。
   位置是 Int16 量化（scale + base 在烘焙数据里），索引为 Uint16/Uint32。 */
(function () {
  var g = window.__NAILONG_GEO__;
  if (!g) return;
  function b64(s) {
    var bin = atob(s);
    var n = bin.length;
    var buf = new ArrayBuffer(n);
    var u8 = new Uint8Array(buf);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return buf;
  }
  g.positions = new Int16Array(b64(g.positions));
  g.indices = (g.idxType === 32) ? new Uint32Array(b64(g.indices)) : new Uint16Array(b64(g.indices));
  if (g.colors) g.colors = new Uint8Array(b64(g.colors));
})();
</script>
<script>__MODEL__</script>
<script>
(function () {
  var msg = document.getElementById('msg');
  var errEl = document.getElementById('err');
  function fail(t) { errEl.textContent = t; msg.textContent = '加载失败'; }

  if (typeof THREE === 'undefined') return fail('three.min.js 未加载');
  if (typeof BLOB === 'undefined') return fail('blob.js 未加载');
  if (typeof buildNailong === 'undefined') return fail('nailong2-model.js 未加载');

  var canvas = document.getElementById('c');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  } catch (e) { return fail('WebGL 初始化失败: ' + e.message); }

  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1f28);
  scene.fog = new THREE.Fog(0x1b1f28, 3.2, 7.0);

  var camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
  camera.position.set(1.15, 1.30, 2.35);

  /* 灯光：三点布光，主光暖、补光冷，让金黄身体有体积感 */
  var hemi = new THREE.HemisphereLight(0xdfe6ff, 0x3a3324, 0.72);
  scene.add(hemi);

  var key = new THREE.DirectionalLight(0xfff2d0, 1.85);
  key.position.set(2.4, 3.6, 2.6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 0.5;
  key.shadow.camera.far = 12;
  key.shadow.camera.left = -2.2; key.shadow.camera.right = 2.2;
  key.shadow.camera.top = 2.6; key.shadow.camera.bottom = -0.4;
  key.shadow.bias = -0.0012;
  key.shadow.normalBias = 0.022;
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x9fc4ff, 0.52);
  fill.position.set(-2.8, 1.5, 1.4);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0xffe9b0, 0.46);
  rim.position.set(-0.8, 1.7, -3.0);
  scene.add(rim);

  /* 地面：接阴影的哑光圆盘，比纯平面更聚气 */
  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(3.6, 64),
    new THREE.MeshStandardMaterial({ color: 0x2a2f3b, roughness: 0.94, metalness: 0.0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.001;
  ground.receiveShadow = true;
  scene.add(ground);
  var grid = new THREE.GridHelper(7, 28, 0x3c4452, 0x30363f);
  grid.position.y = 0.002;
  scene.add(grid);

  /* 模型 */
  var model, orbit = { th: 0.46, ph: 1.36, dist: 2.95, ty: 0.62, tx: 0 };
  try {
    model = buildNailong();
  } catch (e) { return fail('生成模型出错: ' + e.message); }
  scene.add(model.group);
  /* 模型自带阴影贴片不启用：改用真实光源投影 */

  document.getElementById('hTri').textContent = model.triangleCount().toLocaleString();
  var bb = model.stats.bbox;
  document.getElementById('hH').textContent = (bb.max[1] - bb.min[1]).toFixed(3);
  document.getElementById('hW').textContent = (bb.max[0] - bb.min[0]).toFixed(3);

  /* 控件：单指旋转 / 双指缩放平移 */
  var ptrs = {}, last = null, pinch = 0, mode = 'idle', spinT = 0;
  var el = canvas;

  function onDown(e) {
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var n = Object.keys(ptrs).length;
    if (n === 1) last = { x: e.clientX, y: e.clientY };
    else if (n === 2) pinch = dist2();
  }
  function dist2() {
    var k = Object.keys(ptrs);
    var a = ptrs[k[0]], b = ptrs[k[1]];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function onMove(e) {
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var n = Object.keys(ptrs).length;
    if (n === 1 && last) {
      orbit.th -= (e.clientX - last.x) * 0.0082;
      orbit.ph -= (e.clientY - last.y) * 0.0066;
      orbit.ph = Math.max(0.42, Math.min(2.62, orbit.ph));
      last = { x: e.clientX, y: e.clientY };
    } else if (n === 2 && pinch > 0) {
      var d = dist2();
      orbit.dist *= (pinch / Math.max(d, 1));
      orbit.dist = Math.max(1.15, Math.min(6.2, orbit.dist));
      pinch = d;
    }
  }
  function onUp(e) {
    delete ptrs[e.pointerId];
    if (Object.keys(ptrs).length === 0) last = null;
    if (Object.keys(ptrs).length < 2) pinch = 0;
  }
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    orbit.dist *= (1 + Math.sign(e.deltaY) * 0.09);
    orbit.dist = Math.max(1.15, Math.min(6.2, orbit.dist));
  }, { passive: false });

  document.querySelectorAll('.bar button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.bar button').forEach(function (o) { o.classList.remove('on'); });
      b.classList.add('on');
      mode = b.dataset.st;
      if (mode === 'spin') { spinT = 0; mode = 'idle'; }
      model.setState(mode === 'idle' ? 'idle' : mode);
      spinning = (b.dataset.st === 'spin');
      spinT = 0;
    });
  });
  var spinning = false;

  /* 视口 */
  function resize() {
    var w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  /* 主循环 */
  var prev = performance.now(), fpsAcc = 0, fpsN = 0;
  var target = new THREE.Vector3(0, 0.62, 0);
  var camPos = new THREE.Vector3();

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;

    model.update(dt);
    if (spinning) {
      spinT += dt;
      model.group.rotation.y = spinT * Math.PI * 2 / 1.5;
      if (spinT >= 1.5) { spinning = false; model.group.rotation.y = 0; }
    }

    target.set(0, 0.62, 0);

    /* 球坐标相机：orbit.th 水平角、orbit.ph 俯仰角、orbit.dist 距离 */
    var r = orbit.dist;
    camPos.set(
      r * Math.sin(orbit.ph) * Math.sin(orbit.th),
      0.62 + r * Math.cos(orbit.ph),
      r * Math.sin(orbit.ph) * Math.cos(orbit.th)
    );
    camera.position.lerp(camPos, 0.18);
    camera.lookAt(target);

    renderer.render(scene, camera);

    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.5) {
      document.getElementById('hFps').textContent = Math.round(fpsN / fpsAcc);
      fpsAcc = 0; fpsN = 0;
    }
  }

  document.getElementById('loading').style.display = 'none';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
