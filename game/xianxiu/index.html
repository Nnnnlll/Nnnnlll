<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f1d"><title>天道 GM · 万劫仙途</title><style>:root{--bg:#080d19;--p:#121b30dd;--line:#ffffff1c;--t:#edf2ff;--m:#8d9bb9;--g:#e5bd70;--c:#7bcbd8;--v:#a998ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 90% 0,#263b68,transparent 65%),radial-gradient(650px 500px at 0 80%,#1d3942,transparent 65%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1160px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{color:var(--g);font-size:12px;letter-spacing:.16em}.brand b{display:block;color:var(--t);font-size:22px;letter-spacing:0;margin-top:4px}.top button,.choice,.mode,.sys{border:1px solid var(--line);background:#ffffff09;color:var(--t);border-radius:12px;cursor:pointer}.top button{padding:9px 12px}.layout{display:grid;grid-template-columns:290px 1fr;gap:16px}.card{background:var(--p);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 60px #0006,inset 0 1px #fff2;backdrop-filter:blur(18px)}.side{padding:17px;align-self:start;position:sticky;top:16px}.eyebrow{color:var(--m);font-size:10px;letter-spacing:.17em}.profile{padding:15px;margin-top:13px;border-radius:17px;background:#ffffff09}.name{font-size:23px;font-weight:700}.muted,small{color:var(--m);font-size:11px}.realm{color:var(--g);margin-top:12px}.meter{margin-top:13px}.meterline{display:flex;justify-content:space-between;font-size:11px;color:var(--m);margin-bottom:6px}.bar{height:6px;background:#0008;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--g));transition:.3s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{padding:10px;background:#fff1;border-radius:12px}.stat b{display:block;font-size:18px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#fff1;color:#c7d3ef}.systems{display:grid;gap:7px;margin-top:16px}.sys{padding:10px;text-align:left}.main{padding:23px}.setup{max-width:780px;margin:auto;padding:30px}.setup h1{font-size:35px;margin:8px 0}.setup p{color:var(--m);line-height:1.8}.field{margin-top:22px}.field label{display:block;color:#c9d3e9;font-size:12px;margin-bottom:8px}.input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0005;color:var(--t);outline:0}.modegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.mode{padding:11px 8px;text-align:left;min-height:74px}.mode b{display:block;font-size:12px;margin-bottom:5px}.mode small{line-height:1.4}.mode.sel{border-color:var(--g);background:#e5bd7018}.start{width:100%;margin-top:24px;padding:14px;border:0;border-radius:12px;background:linear-gradient(100deg,#bd914a,#ebcf87);font-weight:700;color:#241b0b;cursor:pointer}.storyhead{display:flex;justify-content:space-between;gap:10px}.story h1{font-size:26px;margin:6px 0}.tone{padding:7px 10px;color:var(--g);background:#e5bd7015;border-radius:99px;font-size:11px;white-space:nowrap}.narrative{margin:20px 0;padding:21px;border:1px solid var(--line);border-radius:17px;background:#fff1;min-height:170px;line-height:2;font-family:"Songti SC",serif;font-size:16px}.narrative em{color:var(--g);font-style:normal}.choices{display:grid;gap:9px}.choice{padding:13px 15px;text-align:left;display:flex;gap:12px}.choice:hover{background:#fff2;transform:translateY(-1px)}.choice .num{color:var(--g);font-weight:700}.choice b{display:block}.choice small{display:block;margin-top:5px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.sub{padding:15px}.sub h3{font-size:13px;margin:0 0 10px}.log{height:145px;overflow:auto;display:grid;gap:6px;font-size:11px;color:var(--m)}.log p{margin:0;padding:7px 9px;border-left:2px solid var(--c);background:#fff1}.hidden{display:none!important}@media(max-width:820px){.wrap{padding:13px}.layout{grid-template-columns:1fr}.side{position:static}.modegrid{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}.setup{padding:22px 15px}.main{padding:17px}.narrative{font-size:15px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">天道 GM <b>万劫仙途</b></div><div><button id="save">保存</button> <button id="reset">重开</button></div></header><section id="setup" class="card setup"><div class="eyebrow">命数初定 · 选择你的起点</div><h1>先定此生名姓</h1><p>天道不替你决定成败，只记录每一次选择的因果。宗门、秘境、丹器、情缘与心魔，会随剧情自然发生。</p><div class="field"><label>道号</label><input id="name" class="input" maxlength="12" placeholder="例如：沈砚、宁无缺"></div><div class="field"><label>出身</label><div class="modegrid" id="origins"><button class="mode sel" data-v="散修"><b>散修</b><small>自由，无人庇护</small></button><button class="mode" data-v="宗门弟子"><b>宗门弟子</b><small>有传承也有规矩</small></button><button class="mode" data-v="世家遗孤"><b>世家遗孤</b><small>背负旧因果</small></button><button class="mode" data-v="凡俗皇族"><b>凡俗皇族</b><small>气运纠缠</small></button><button class="mode" data-v="转世之人"><b>转世之人</b><small>记忆未醒</small></button></div></div><div class="field"><label>基调</label><div class="modegrid" id="tones"><button class="mode sel" data-v="凡人流苦修"><b>凡人流苦修</b><small>资源匮乏，步步为营</small></button><button class="mode" data-v="爽文崛起"><b>爽文崛起</b><small>机缘密集，逆势破局</small></button><button class="mode" data-v="暗黑残酷"><b>暗黑残酷</b><small>代价真实，善恶难分</small></button><button class="mode" data-v="逍遥佛系"><b>逍遥佛系</b><small>随缘而行</small></button><button class="mode" data-v="宗门权谋"><b>宗门权谋</b><small>资源背后皆人心</small></button></div></div><button id="start" class="start">请天道落笔</button></section><section id="game" class="layout hidden"><aside class="card side"><div class="eyebrow">命书 · 持续变化</div><div class="profile"><div id="gname" class="name">—</div><div id="origin" class="muted">—</div><div id="realm" class="realm">炼气</div><div class="meter"><div class="meterline"><span>修为</span><span id="xptext">0 / 100</span></div><div class="bar"><i id="xpbar"></i></div></div></div><div class="stats"><div class="stat"><b id="luck">10</b><span class="muted">气运</span></div><div class="stat"><b id="heart">0</b><span class="muted">心魔</span></div><div class="stat"><b id="life">80</b><span class="muted">寿元</span></div><div class="stat"><b id="spirit">30</b><span class="muted">灵石</span></div></div><div id="tags" class="tags"></div><div class="systems"><button class="sys" data-sys="转世轮回">↻ 转世轮回</button><button class="sys" data-sys="灵宠契约">◈ 灵宠契约</button><button class="sys" data-sys="道侣因缘">◇ 道侣与因缘</button><button class="sys" data-sys="血脉觉醒">✦ 血脉觉醒</button></div></aside><section class="card main"><div class="storyhead"><div><div id="chapter" class="eyebrow">第一卷 · 山河初醒</div><h1 id="title">—</h1></div><div id="tone" class="tone">—</div></div><div id="text" class="narrative"></div><div id="choices" class="choices"></div><div class="lower"><section class="card sub"><h3>天道记录</h3><div id="log" class="log"></div></section><section class="card sub"><h3>已知因果</h3><div id="relations" class="log"></div></section></div></section></section></main><script>(function(){'use strict';var $=function(x){return document.getElementById(x)},S={name:'',origin:'散修',tone:'凡人流苦修',realm:0,xp:0,luck:10,heart:0,life:80,spirit:30,day:1,tags:['凡骨'],rels:[],scene:0,started:false},R=['炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫飞升'],E=[{c:'第一卷 · 山河初醒',t:'雨夜，青云山下',x:'雨水沿着破旧斗笠落下。你在山脚醒来，掌心握着一枚陌生的青铜残片。远处，<em>青云宗</em>山门灯火如龙；近处，一名负伤少女护着一只青色小兽。天道没有给答案，只把路摆在眼前。',o:[['救下少女','挡住追兵，结下一段未明因果。','道侣'],['取走残片','残片融入血肉，血脉深处传来古老叹息。','血脉'],['绕路上山','不沾是非，独自叩响外门石门。','稳健'],['观察追兵','记住黑衣人的宗门印记。','情报']]},{c:'第一卷 · 山河初醒',t:'一炷香的选择',x:'选择落定，世界便不再回头。青云宗外门发放引气诀，执事把最末等的蒲团推到角落。与此同时，少女的名字传遍山门：<em>苏晚照</em>，掌门亲传。',o:[['低头修炼','不争名次，只将每缕灵气纳入经脉。','修为'],['展示残片','换取一次查阅秘卷的机会。','秘境'],['寻找苏晚照','她问：你救我是慈悲，还是回报？','道侣'],['拜入长老门下','用情报换取长老注意，踏入暗流。','权谋']]},{c:'第二卷 · 外门风雪',t:'丹炉与剑鸣',x:'修行不只在蒲团上。药圃灵草、炼器炉火、秘境名额，开始改变旁人看你的方式，也改变你自己。',o:[['学习炼丹','三份低阶灵草，炼出第一枚聚气丹。','炼丹'],['学习炼器','在剑胚刻下符纹，虎口裂开，剑却有了灵性。','炼器'],['报名秘境','炼气修为也敢报名？你把名字写在名册最前。','秘境'],['闭关苦修','拒绝邀约，夜深时心底另一个声音开始说话。','心魔']]}];function need(){return 100+S.realm*180}function lg(t){var p=document.createElement('p');p.textContent='第 '+S.day+' 日 · '+t;$('log').prepend(p)}function draw(){ $('gname').textContent=S.name;$('origin').textContent=S.origin;$('realm').textContent=R[S.realm];$('xptext').textContent=S.xp+' / '+need();$('xpbar').style.width=Math.min(100,S.xp/need()*100)+'%';$('luck').textContent=S.luck;$('heart').textContent=S.heart;$('life').textContent=S.life;$('spirit').textContent=S.spirit;$('tone').textContent=S.tone;$('tags').innerHTML=S.tags.map(function(x){return '<span class="tag">'+x+'</span>'}).join('');$('relations').innerHTML=(S.rels.length?S.rels:['尚无重要因果']).map(function(x){return '<p>'+x+'</p>'}).join('')}function advance(n){S.xp+=n;S.day++;S.life--;while(S.xp>=need()&&S.realm<8){S.xp-=need();S.realm++;S.luck++;S.tags.push('境界突破');lg('你踏入'+R[S.realm]+'境，天地灵机为之一变。')}}function render(){var e=E[Math.min(S.scene,E.length-1)];$('chapter').textContent=e.c;$('title').textContent=e.t;$('text').innerHTML=e.x;$('choices').innerHTML=e.o.map(function(o,i){return '<button class="choice" data-i="'+i+'"><span class="num">0'+(i+1)+'</span><span><b>'+o[0]+'</b><small>'+o[1]+'</small></span></button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('.choice'),function(b){b.onclick=function(){choose(e.o[+b.dataset.i])}})}function choose(o){var k=o[2],n=S.tone==='爽文崛起'?40:18;if(k==='修为')n+=18;if(k==='稳健')S.spirit+=8;if(k==='心魔'){S.heart+=2;S.luck--;S.tags.push('心魔初生')}if(k==='血脉'){S.luck+=3;S.tags.push('未知血脉')}if(k==='道侣'){S.rels.push('苏晚照 · 初见');S.tags.push('情缘初结')}if(k==='秘境')S.tags.push('秘境线索');if(k==='炼丹'){S.tags.push('丹道入门');S.spirit+=15}if(k==='炼器')S.tags.push('器道入门');if(k==='权谋')S.rels.push('青云宗 · 暗线');advance(n);lg(o[1]);S.scene++;render();draw();save()}function save(){localStorage.setItem('xianxiu-gm-v3',JSON.stringify(S))}function start(){S.name=$('name').value.trim()||'无名客';S.origin=document.querySelector('#origins .sel').dataset.v;S.tone=document.querySelector('#tones .sel').dataset.v;S.started=true;$('setup').classList.add('hidden');$('game').classList.remove('hidden');lg('天道落笔：'+S.name+'，一生从此有了记录。');render();draw();save()}Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){b.onclick=function(){Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}});$('start').onclick=start;$('save').onclick=function(){save();lg('命书已保存。')};$('reset').onclick=function(){if(confirm('确定抹去这一世因果？')){localStorage.removeItem('xianxiu-gm-v3');location.reload()}};Array.prototype.forEach.call(document.querySelectorAll('[data-sys]'),function(b){b.onclick=function(){lg(b.dataset.sys+'已纳入命书，等待因果触发。')}});try{var q=localStorage.getItem('xianxiu-gm-v3');if(q){S=JSON.parse(q);if(S.started){$('setup').classList.add('hidden');$('game').classList.remove('hidden');render();draw();lg('命书回溯成功。')}}}catch(e){}})();</script></body></html>
