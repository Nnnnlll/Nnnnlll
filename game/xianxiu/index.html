<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>凡人修仙录</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#26385b,#0d1421 48%,#080d16);color:#e9efff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:18px}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{font-size:24px;margin:0}.top p{margin:4px 0 0;color:#9eafd0;font-size:12px}.realm{padding:14px 16px;border:1px solid #ffffff20;border-radius:20px;background:#ffffff0c;box-shadow:inset 0 1px #ffffff16,0 18px 45px #0005;backdrop-filter:blur(18px);margin-bottom:12px}.realm-row{display:flex;justify-content:space-between;gap:12px;align-items:end}.realm-name{font-size:20px;font-weight:700;color:#f5d790}.realm-xp{font-size:12px;color:#aebbd4}.bar{height:7px;border-radius:99px;background:#0005;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6f9dff,#dcb66c);border-radius:inherit;transition:width .3s}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.panel{border:1px solid #ffffff18;border-radius:20px;background:#ffffff0b;padding:16px;box-shadow:inset 0 1px #ffffff12,0 14px 34px #0004;backdrop-filter:blur(16px)}.panel h2{font-size:15px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:10px;border-radius:14px;background:#ffffff0a}.stat small{display:block;color:#9eafd0;font-size:11px}.stat b{display:block;font-size:20px;margin-top:3px}.actions{display:grid;gap:8px}.btn{border:1px solid #ffffff20;background:#ffffff10;color:#edf3ff;border-radius:13px;padding:11px 12px;font:inherit;text-align:left;cursor:pointer;transition:.15s}.btn:hover{background:#ffffff1b;transform:translateY(-1px)}.btn:active{transform:scale(.98)}.btn.primary{background:#5279d9;border-color:#7698ed}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.log{height:178px;overflow:auto;display:flex;flex-direction:column-reverse;gap:8px;color:#bac7df;font-size:12px;line-height:1.55}.entry{padding:8px 10px;border-left:2px solid #6f9dff;background:#ffffff08;border-radius:0 10px 10px 0}.entry.good{border-color:#7bd59b}.entry.warn{border-color:#dcb66c}.foot{margin-top:12px;color:#8192b1;font-size:11px;text-align:center}@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}.top h1{font-size:21px}.log{height:130px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>凡人修仙录</h1><p>从一介凡人，走到仙道尽头</p></div><div id="day">第 1 日</div></header>
<section class="realm"><div class="realm-row"><div><div class="realm-name" id="realm">炼气一层</div><div class="realm-xp" id="xpText">修为 0 / 100</div></div><div id="spirit">灵石 30</div></div><div class="bar"><i id="xpBar"></i></div></section>
<div class="grid"><section class="panel"><h2>修行</h2><div class="stats"><div class="stat"><small>体魄</small><b id="body">10</b></div><div class="stat"><small>悟性</small><b id="wisdom">10</b></div><div class="stat"><small>气血</small><b id="hp">100</b></div><div class="stat"><small>寿元</small><b id="life">80</b></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="cultivate">☯ 打坐修炼 <span>+18修为</span></button><button class="btn" id="explore">🌲 入山历练 <span>高风险高回报</span></button><button class="btn" id="buy">🧪 购买聚气丹 <span>20灵石</span></button></div></section><section class="panel"><h2>修仙日志</h2><div class="log" id="log"></div></section></div><div class="foot">每次行动都会消耗一天时间 · 量力而行，渡劫勿莽</div>
</main>
<script>
(function(){'use strict';var s={day:1,xp:0,spirit:30,body:10,wisdom:10,hp:100,life:80,realm:0};var realms=['炼气一层','炼气二层','炼气三层','筑基初期','筑基中期','筑基后期','金丹初期','金丹中期','金丹后期','元婴初期'];var need=function(){return 100+s.realm*80};var $=function(x){return document.getElementById(x)};function log(t,c){var d=document.createElement('div');d.className='entry '+(c||'');d.textContent='第 '+s.day+' 日 · '+t;$('log').prepend(d)}function draw(){ $('day').textContent='第 '+s.day+' 日';$('realm').textContent=realms[s.realm];$('xpText').textContent='修为 '+s.xp+' / '+need();$('xpBar').style.width=Math.min(100,s.xp/need()*100)+'%';$('spirit').textContent='灵石 '+s.spirit;$('body').textContent=s.body;$('wisdom').textContent=s.wisdom;$('hp').textContent=s.hp;$('life').textContent=s.life;$('buy').disabled=s.spirit<20||s.hp>=100}function advance(){s.day++;s.life--;if(s.life<=0||s.hp<=0){log('寿元已尽，修仙路止步于此。','warn');['cultivate','explore','buy'].forEach(function(x){$(x).disabled=true})}}function gain(n){s.xp+=n;while(s.xp>=need()&&s.realm<realms.length-1){s.xp-=need();s.realm++;s.body+=4;s.wisdom+=2;log('突破成功！踏入'+realms[s.realm]+'。','good')}}$('cultivate').onclick=function(){gain(18+Math.floor(Math.random()*s.wisdom/3));s.hp=Math.min(100,s.hp+5);log('静心打坐，灵气在经脉中流转。','good');advance();draw()};$('explore').onclick=function(){var r=Math.random();if(r<.22){s.hp-=25;log('遭遇山魈，负伤而归，气血 -25。','warn')}else if(r<.48){s.spirit+=18;gain(30);log('寻得灵草与灵石，收获颇丰。','good')}else{gain(12);s.spirit+=5;log('斩杀妖兽，带回少量灵石。')}advance();draw()};$('buy').onclick=function(){s.spirit-=20;s.hp=Math.min(100,s.hp+35);gain(8);log('服下聚气丹，气血恢复，修为 +8。','good');advance();draw()};log('你在青云山脚醒来，手里只有三十枚灵石。','good');draw()})();
</script>
</body></html>
