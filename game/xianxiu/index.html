</style></head><body><main class="wrap"><header class="top"><div class="brand">天道 GM <b>万劫仙途</b></div></header><section id="setup" class="card setup"><div class="eyebrow">命数初定 · 选择你的起点</div><p>天道不替你决定成败，只记录每一次选择的因果。宗门、秘境、丹器、情缘与心魔，会随剧情自然发生。</p><div class="field"><label>道号</label><input id="name" class="input" maxlength="12" placeholder="例如：沈砚、宁无缺"></div><div class="field"><label>出身</label><div class="modegrid" id="origins"><button class="mode sel" data-v="散修"><b>散修</b><small>自由，无人庇护</small></button><button class="mode" data-v="宗门弟子"><b>宗门弟子</b><small>有传承也有规矩</small></button><button class="mode" data-v="世家遗孤"><b>世家遗孤</b><small>背负旧因果</small></button><button class="mode" data-v="凡俗皇族"><b>凡俗皇族</b><small>气运纠缠</small></button><button class="mode" data-v="转世之人"><b>转世之人</b><small>记忆未醒</small></button></div></div><div class="field"><label>基调</label><div class="modegrid" id="tones"><button class="mode sel" data-v="凡人流苦修"><b>凡人流苦修</b><small>资源匮乏，步步为营</small></button><button class="mode" data-v="爽文崛起"><b>爽文崛起</b><small>机缘密集，逆势破局</small></button><button class="mode" data-v="暗黑残酷"><b>暗黑残酷</b><small>代价真实，善恶难分</small></button><button class="mode" data-v="逍遥佛系"><b>逍遥佛系</b><small>随缘而行</small></button><button class="mode" data-v="宗门权谋"><b>宗门权谋</b><small>资源背后皆人心</small></button></div></div><button id="start" class="start">请天道落笔</button></section><section id="game" class="layout hidden"><aside class="card side"><div class="eyebrow">命书 · 持续变化</div><div class="profile"><div id="gname" class="name">—</div><div id="origin" class="muted">—</div><div id="realm" class="realm">炼气</div><div class="meter"><div class="meterline"><span>修为</span><span id="xptext">0 / 100</span></div><div class="bar"><i id="xpbar"></i></div></div></div><div class="stats"><div class="stat"><b id="luck">10</b><span class="muted">气运</span></div><div class="stat"><b id="heart">0</b><span class="muted">心魔</span></div><div class="stat"><b id="life">80</b><span class="muted">寿元</span></div><div class="stat"><b id="spirit">30</b><span class="muted">灵石</span></div></div><div id="tags" class="tags"></div><div class="systems"><button class="sys" data-sys="丹药商店">丹药商店</button><button class="sys" data-sys="法器商店">法器商店</button><button class="sys" data-sys="道侣好感度">道侣好感度</button><button class="sys" data-sys="灵宠契约">灵宠契约</button><button class="sys" data-sys="转世轮回">转世轮回</button><button id="save" class="sys">保存命书</button><button id="reset" class="sys danger">重开此世</button></div></aside><section class="card main"><div class="storyhead"><div><div id="chapter" class="eyebrow">第一卷 · 山河初醒</div><h1 id="title">—</h1></div><div id="tone" class="tone">—</div></div><div id="text" class="narrative"></div><div id="choices" class="choices"></div><div class="lower"><section class="card sub"><h3>天道记录</h3><div id="log" class="log"></div></section><section class="card sub"><h3>已知因果</h3><div id="relations" class="log"></div></section></div></section></section></main><script>(function(){'use strict';var $=function(x){return document.getElementById(x)},S={name:'',origin:'散修',tone:'凡人流苦修',realm:0,xp:0,luck:10,heart:0,life:80,spirit:30,favor:0,day:1,tags:['凡骨'],rels:[],scene:0,started:false},R=['炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫飞升'],E=[{c:'第一卷 · 山河初醒',t:'雨夜，青云山下',x:'雨水沿着破旧斗笠落下。你在山脚醒来，掌心握着一枚陌生的青铜残片。远处，<em>青云宗</em>山门灯火如龙；近处，一名负伤少女护着一只青色小兽。天道没有给答案，只把路摆在眼前。',o:[['救下少女','挡住追兵，结下一段未明因果。','道侣'],['取走残片','残片融入血肉，血脉深处传来古老叹息。','血脉'],['绕路上山','不沾是非，独自叩响外门石门。','稳健'],['观察追兵','记住黑衣人的宗门印记。','情报']]},{c:'第一卷 · 山河初醒',t:'一炷香的选择',x:'选择落定，世界便不再回头。青云宗外门发放引气诀，执事把最末等的蒲团推到角落。与此同时，少女的名字传遍山门：<em>苏晚照</em>，掌门亲传。',o:[['低头修炼','不争名次，只将每缕灵气纳入经脉。','修为'],['展示残片','换取一次查阅秘卷的机会。','秘境'],['寻找苏晚照','她问：你救我是慈悲，还是回报？','道侣'],['拜入长老门下','用情报换取长老注意，踏入暗流。','权谋']]},{c:'第二卷 · 外门风雪',t:'丹炉与剑鸣',x:'修行不只在蒲团上。药圃灵草、炼器炉火、秘境名额，开始改变旁人看你的方式，也改变你自己。',o:[['学习炼丹','三份低阶灵草，炼出第一枚聚气丹。','炼丹'],['学习炼器','在剑胚刻下符纹，虎口裂开，剑却有了灵性。','炼器'],['报名秘境','炼气修为也敢报名？你把名字写在名册最前。','秘境'],['闭关苦修','拒绝邀约，夜深时心底另一个声音开始说话。','心魔']]}];function need(){return 100+S.realm*180}function lg(t){var p=document.createElement('p');p.textContent='第 '+S.day+' 日 · '+t;$('log').prepend(p)}function draw(){ $('gname').textContent=S.name;$('origin').textContent=S.origin;$('realm').textContent=R[S.realm];$('xptext').textContent=S.xp+' / '+need();$('xpbar').style.width=Math.min(100,S.xp/need()*100)+'%';$('luck').textContent=S.luck;$('heart').textContent=S.heart;$('life').textContent=S.life;$('spirit').textContent=S.spirit;$('tone').textContent=S.tone;$('tags').innerHTML=S.tags.map(function(x){return '<span class="tag">'+x+'</span>'}).join('');$('relations').innerHTML=(S.rels.length?S.rels:['尚无重要因果']).map(function(x){return '<p>'+x+'</p>'}).join('')}function advance(n){S.xp+=n;S.day++;S.life--;while(S.xp>=need()&&S.realm<8){S.xp-=need();S.realm++;S.luck++;S.tags.push('境界突破');lg('你踏入'+R[S.realm]+'境，天地灵机为之一变。')}}function render(){var e=E[Math.min(S.scene,E.length-1)];$('chapter').textContent=e.c;$('title').textContent=e.t;$('text').innerHTML=e.x;$('choices').innerHTML=e.o.map(function(o,i){return '<button class="choice" data-i="'+i+'"><span class="num">0'+(i+1)+'</span><span><b>'+o[0]+'</b><small>'+o[1]+'</small></span></button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('.choice'),function(b){b.onclick=function(){choose(e.o[+b.dataset.i])}})}function choose(o){var k=o[2],n=S.tone==='爽文崛起'?40:18;if(k==='修为')n+=18;if(k==='稳健')S.spirit+=8;if(k==='心魔'){S.heart+=2;S.luck--;S.tags.push('心魔初生')}if(k==='血脉'){S.luck+=3;S.tags.push('未知血脉')}if(k==='道侣'){S.rels.push('苏晚照 · 初见');S.tags.push('情缘初结');S.favor+=10}if(k==='秘境')S.tags.push('秘境线索');if(k==='炼丹'){S.tags.push('丹道入门');S.spirit+=15}if(k==='炼器')S.tags.push('器道入门');if(k==='权谋')S.rels.push('青云宗 · 暗线');advance(n);lg(o[1]);S.scene++;render();draw();save()}function save(){localStorage.setItem('xianxiu-gm-v3',JSON.stringify(S))}function start(){S.name=$('name').value.trim()||'无名客';S.origin=document.querySelector('#origins .sel').dataset.v;S.tone=document.querySelector('#tones .sel').dataset.v;S.started=true;$('setup').classList.add('hidden');$('game').classList.remove('hidden');lg('天道落笔：'+S.name+'，一生从此有了记录。');render();draw();save()}Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){b.onclick=function(){Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}});$('start').onclick=start;$('save').onclick=function(){save();lg('命书已保存。')};$('reset').onclick=function(){if(confirm('确定抹去这一世因果？')){localStorage.removeItem('xianxiu-gm-v3');location.reload()}};Array.prototype.forEach.call(document.querySelectorAll('[data-sys]'),function(b){b.onclick=function(){if(b.dataset.sys==='道侣好感度'){lg('苏晚照当前好感度：'+S.favor+'。')}else if(b.dataset.sys==='丹药商店'){lg('丹药商店：聚气丹 12 灵石，暂未购买。')}else if(b.dataset.sys==='法器商店'){lg('法器商店：青锋剑 30 灵石，暂未购买。')}else{lg(b.dataset.sys+'已纳入命书，等待因果触发。')}}});try{var q=localStorage.getItem('xianxiu-gm-v3');if(q){S=JSON.parse(q);if(S.started){$('setup').classList.add('hidden');$('game').classList.remove('hidden');render();draw();lg('命书回溯成功。')}}}catch(e){}})();</script></body></html>
