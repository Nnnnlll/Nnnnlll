<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ddf3e7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="奶蛙2048">
<meta name="description" content="奶蛙2048 · 纯前端小游戏：一群奶蛙漂在池塘里不受重力，上下左右滑动改变重力方向，同款相撞即合成 2→4→8→…→2048。">
<title>奶蛙2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <!-- ===== 游戏区（棋盘 + 棋盘下方状态条） ===== -->
  <div class="left">

    <section class="stage" id="stage">
      <canvas id="game" aria-label="奶蛙2048 游戏区域"></canvas>

      <div class="hint" id="hint">
        <span class="hint-ico">👆</span>
        <span class="hint-txt">上下左右滑动 · 改变重力方向</span>
      </div>
    </section>

    <!-- 方向键：放在棋盘正下方（手机上好按，也不用依赖滑动手势） -->
    <div class="board-pad">
      <button class="grav-chip" id="gUp" type="button" aria-label="重力向上">↑</button>
      <button class="grav-chip" id="gLeft" type="button" aria-label="重力向左">←</button>
      <button class="grav-chip" id="gDown" type="button" aria-label="重力向下">↓</button>
      <button class="grav-chip" id="gRight" type="button" aria-label="重力向右">→</button>
    </div>

    <div class="board-foot">
      <div class="foot-row">
        <span class="foot-item">重力方向<b id="footGrav">漂浮中</b></span>
        <span class="foot-item">已滑次数<b id="footMoves">0</b></span>
        <span class="foot-item">这一轮<b id="footState">滑动决定重力方向</b></span>
      </div>
      <p class="foot-tips">
        上下左右滑动（或用方向键 / WASD / 点上面那排方向键）改变重力方向，奶蛙就朝那边掉。<br>
        同款奶蛙撞到一起就合成下一级；<b>整池停下来</b>之后才会冒出下一批（一次三只，漂着不受重力）。
      </p>
    </div>

  </div>

  <!-- ===== 侧边面板 ===== -->
  <aside class="panel">

    <header class="panel-head">
      <h1>奶蛙2048</h1>
      <p class="subtitle">滑动改变重力 · 同款奶蛙撞到一起就合成</p>
    </header>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">分数</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">最高分</span>
        <strong class="stat-value stat-best" id="best">0</strong>
      </div>
    </div>

    <div class="jam-box">
      <span class="box-label">池塘拥挤度 <b id="jamPct">0%</b></span>
      <div class="jam-bar"><i id="jamFill"></i></div>
    </div>

    <div class="next-box">
      <span class="box-label">下一个</span>
      <canvas id="next" width="360" height="160" aria-label="下一批奶蛙"></canvas>
      <p class="next-tip" id="nextTip">整池静止后一次出现 3 只（漂着，不受重力）</p>
    </div>

    <div class="chain-box">
      <span class="box-label">合成表</span>
      <canvas id="chain" width="700" height="240" aria-label="合成顺序"></canvas>
    </div>

    <div class="medal" id="medal" hidden>🏅 已合成 2048</div>

    <div class="actions">
      <button class="btn" id="soundBtn" type="button" aria-pressed="true">
        <span class="ico">🔊</span><span class="lbl">音效开</span>
      </button>
      <button class="btn btn-primary" id="resetBtn" type="button" title="重新开始">
        <span class="ico">↻</span><span class="lbl">重开</span>
      </button>
    </div>

  </aside>

</main>

<!-- ===== 结算弹窗（最顶层，不塞在棋盘容器里） ===== -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="dialog-emoji">🐸</div>
    <h2 id="overTitle">池塘挤爆了</h2>
    <p class="dialog-score">本局得分 <strong id="finalScore">0</strong></p>
    <p class="dialog-best">最高分 <span id="finalBest">0</span></p>

    <div class="dialog-actions">      <button class="btn btn-primary" id="restartBtn" type="button">再来一局</button>
    </div>    <p class="dialog-hint">按 R 键也可重新开始</p>
  </div>
</div>



<!-- 碰撞形状数据（按贴图轮廓自动生成，沿用 BigNaiWa 样例的 parts.js） -->
<script src="assets/frogs/parts.js"></script>
<script src="game.js"></script>
</body>
</html>
